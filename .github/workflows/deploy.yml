name: Build & deploy

# Sur chaque push vers `main` : on vérifie que le projet compile (types + build Nuxt)
# avant de déclencher le déploiement Coolify. Un commit qui casse le build
# n'atteint donc jamais la production.

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy hook
        # L'URL du hook vit dans les Secrets du dépôt (Settings → Secrets → COOLIFY_DEPLOY_HOOK_URL).
        run: curl -sS --fail -X POST "$COOLIFY_DEPLOY_HOOK_URL"
        env:
          COOLIFY_DEPLOY_HOOK_URL: ${{ secrets.COOLIFY_DEPLOY_HOOK_URL }}
