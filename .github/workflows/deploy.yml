name: Build & deploy

# Sur chaque push vers `main` : on vérifie que le projet compile (types + build Nuxt)
# avant de déclencher le déploiement Coolify. Un commit qui casse le build
# n'atteint donc jamais la production.

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy hook
        # L'URL du hook vit dans les Secrets du dépôt :
        # Settings → Secrets and variables → Actions → New repository secret
        #   Nom   : COOLIFY_DEPLOY_HOOK_URL
        #   Valeur: l'URL du webhook fournie par Coolify (https://…/api/v1/deploy?uuid=…)
        run: |
          if [ -z "$COOLIFY_DEPLOY_HOOK_URL" ]; then
            echo "::error::Le secret COOLIFY_DEPLOY_HOOK_URL est vide ou absent."
            echo "Créez-le dans Settings → Secrets and variables → Actions → New repository secret."
            echo "Attention : un « secret », pas une « variable », et sur CE dépôt."
            exit 1
          fi
          # --fail-with-body affiche la réponse de Coolify en cas d'erreur HTTP.
          curl -sS --fail-with-body -X POST "$COOLIFY_DEPLOY_HOOK_URL"
        env:
          COOLIFY_DEPLOY_HOOK_URL: ${{ secrets.COOLIFY_DEPLOY_HOOK_URL }}
